<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>html, body, iframe { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; }</style>
</head>
<body>
  <!-- The checker is the hosted web app. On a real web origin Firebase App Check
       can use reCAPTCHA Enterprise (extension pages cannot load it), and
       allow="language-model" hands Chrome's on-device Prompt API to the frame. -->
  <iframe id="app" allow="language-model" title="Before You Pay"></iframe>
  <script src="app-url.js"></script>
  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
